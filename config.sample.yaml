# Sample configuration. Keys and secrets come from the environment:
#   HASH_KEY   base64, at least 32 bytes: openssl rand -base64 64
#   BLOCK_KEY  base64, exactly 32 bytes:  openssl rand -base64 32
#   CLIENT_SECRET, expanded below
listenAddr: ":8080"
basePath: /bff
origins:
  - https://inventory.example.com
redirectURL: https://inventory.example.com/callback
postLogoutRedirectURL: https://inventory.example.com/
sessionPath: /var/lib/token-handler/sessions
sessionMaxAge: 10h
providers:
  netic:
    issuer: https://keycloak.example.com/realms/mcs
    clientID: inventory.example.com
    clientSecret: ${CLIENT_SECRET}
    scopes: [profile, email]
upstreams:
  - path: /api
    url: http://k8s-inventory-server:8087
    stripPrefix: true
